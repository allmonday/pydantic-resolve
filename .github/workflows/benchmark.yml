name: Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'pydantic_resolve/**'
      - 'benchmarks/**'
      - '!benchmarks/results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        run: uv run python benchmarks/bench_compare.py --ci --json benchmarks/results/benchmark_history.json

      - name: Check for regressions
        id: regression
        continue-on-error: true
        run: uv run python benchmarks/report.py --threshold 20

      - name: Generate HTML report
        if: always()
        run: uv run python benchmarks/report.py --output benchmarks/results/benchmark_report.html

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/benchmark_history.json benchmarks/results/benchmark_report.html
          git diff --cached --quiet || git commit -m "bench: update benchmark results [skip ci]"
          git push

      - name: Deploy to gh-pages
        if: always()
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p benchmark
          cp benchmarks/results/benchmark_report.html benchmark/index.html
          git add benchmark/index.html
          git diff --cached --quiet || git commit -m "bench: deploy benchmark report"
          git push origin gh-pages
          git checkout master
